[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suspicious-login-detection-api"
version = "0.1.0"
description = "An API for evaluating suspicious login events."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "geoip2>=4.8",
    "joblib>=1.4",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "scikit-learn>=1.6",
    "sqlalchemy>=2.0",
    "user-agents>=2.2",
    "uvicorn[standard]>=0.34",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.23",
    "httpx2>=2.0",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["demo.html"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["user_agents"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
